name: Apply reviewed monitor patch
on:
  push:
    branches: [fix/new-window-monitor]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Apply the checked patch on this branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/new-window-monitor
          test "$(git rev-parse HEAD^)" = fac221b16650586430426bd08bb1266603b09f48
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          encoded = ''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '8b29865c916d7667898ab4cd85753f590b297d768d0991f06435c6aeda120a21'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'monitor-fix.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          PY
          git diff --cached --check
          git rm .github/workflows/apply-monitor-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve launch monitor intent and bound startup corrections'
          git push origin HEAD:refs/heads/fix/new-window-monitor
