name: Apply reviewed audit patch
on:
  pull_request:
    paths: ['.github/workflows/apply-release-audit.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == 'nroj95/super-hotkey' && github.event.pull_request.head.ref == 'release-audit-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Commit the reviewed patch on the audit branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 4d07736fec0a67362dbcdbd1ea7448e92264fc18
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          encoded = ' '
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '738e94b8345041e20685b4c9bdf8f31a1eb841996f291f77a748aef0d268a1e8', 'Patch checksum mismatch'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-audit.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          PY
          git diff --check
          git add README.md core/application.ahk core/help.ahk core/keybindings.ahk core/windows.ahk docs/implementation.md docs/integration-status.md modules/power-hotkey/power-hotkey.ahk modules/scratchpad/adapter.ahk modules/scratchpad/scratchpad.ahk modules/window-cascade/focus-corners.ahk modules/window-cascade/suspension.ahk modules/wonder-windows/adapter.ahk tests/check.py tests/release-check.ahk tests/runtime-check.ahk tests/upgrade-check.ahk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden input lifecycle and window handling for first release'
          git push origin HEAD:refs/heads/release-audit-20261016
